name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          npm install --include=optional
          npm install @rolldown/binding-linux-x64-gnu

      # 4. Build web application
      - name: Build web app
        run: npm run build

      # 5. Check Capacitor
      - name: Check Capacitor
        run: npx cap --version

        # 6. Add Android platform
  - name: Add Android platform
    run: npx cap add android

  # 6.5 Generate Android app icons
  - name: Generate Android app icons
    run: npx @capacitor/assets generate --android

  # 7. Sync web app to Android

      # 7.5 Configure Gradle wrapper for reliable download
      - name: Configure Gradle wrapper
        working-directory: android
        run: |
          sed -i 's/gradle-8.11.1-all.zip/gradle-8.11.1-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          echo "networkTimeout=120000" >> gradle/wrapper/gradle-wrapper.properties

      # 8. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 9. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 10. Build debug APK
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Steve-Rogers-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
